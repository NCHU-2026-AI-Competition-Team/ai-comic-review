# Modal OCR 服务配置
# 修改后执行：modal deploy modal/ocr/serve.py

# --- GPU ---
gpu:
  type: "T4"                     # OCR 体量用 T4 即可；PaddleOCR-VL-1.6（0.9B）同卡懒加载
  count: 1

# --- Serving ---
serving:
  app_name: "ai-comic-review-ocr"
  container_idle_timeout: 300    # 秒，空闲后自动缩容
  max_concurrent_requests: 1     # 单卡串行，避免 VL 兜底时显存争用
  request_timeout: 300           # 秒，含冷启动与 VL 兜底
  startup_timeout: 1800          # 秒，首次拉取权重

# --- 模型（与 ai/ocr 配置标识严格一致，禁止静默替换）---
models:
  primary: "PP-OCRv6"            # PaddleOCR ocr_version；PaddleX 映射为 PP-OCRv6_mobile
  fallback: "PaddleOCR-VL-1.6"   # 须 PaddleOCRVL(pipeline_version="v1.6")，禁止落到默认 v1.5
  lang: "ch"
  fallback_confidence_threshold: 0.6

# --- 镜像 ---
image:
  python: "3.11"
  paddle_index: "https://www.paddlepaddle.org.cn/packages/stable/cu126/"
  paddle_package: "paddlepaddle-gpu==3.2.1"
